name: Marketing Analytics CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  analytics-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Download official UCI data
        run: python -m src.download_data
      - name: Execute analytics pipeline
        run: python -m src.run_analysis
      - name: Validate deliverables
        run: |
          test -s outputs/executive_summary.csv
          test -s outputs/job_performance.csv
          test -s outputs/month_performance.csv
          test -s outputs/contact_method_performance.csv
          test -s outputs/previous_outcome_performance.csv
          test -s outputs/contact_frequency_effect.csv
          test -s outputs/customer_segments.csv
          test -s outputs/duration_diagnostic.csv
